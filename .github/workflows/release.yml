name: Release

# Triggered by pushing a tag like v1.2.3.
# The Windows job builds a Velopack package, creates the GitHub Release, and uploads the
# Windows assets. The Linux job then packs a Velopack AppImage and uploads the Linux assets
# to the SAME release. UpdateService.cs (GithubSource) auto-selects the per-OS channel
# ("win" default vs "linux") on its next periodic poll, so the two asset sets coexist.
#
# Both jobs fetch the PREVIOUS release's full package before packing: that is what makes
# vpk pack emit a -delta.nupkg, which is what turns an update from "the whole app again"
# (63 MB win / 196 MB linux) into "the bytes that changed". Installed builds apply deltas
# automatically and fall back to the full package when the chain is unusable (see
# UpdateService.PlanDownload, which models exactly this decision).

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # needed to create the release

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Derive version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Tag must look like v1.2.3 (got $tag)"
          }
          $version = $matches[1]
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $version"

      - name: Restore + test
        run: |
          dotnet restore
          dotnet test --configuration Release --no-restore

      - name: Publish self-contained win-x64
        # -f is REQUIRED now the csproj multi-targets (net10.0-windows…;net10.0) — without it publish fails
        # NETSDK1129. Must be the WINDOWS TFM: net10.0 would ship the portable (WebView2-less, CefGlue) head
        # to existing Windows users via auto-update.
        run: |
          dotnet publish src/CSUploader/CSUploader.csproj `
            -f net10.0-windows10.0.17763.0 `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:Version=${{ steps.version.outputs.version }} `
            -o publish

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 1.2.0

      # The notes file is REQUIRED, not best-effort: --releaseNotes below embeds it in the package,
      # which is where the in-app update prompt's "What's new" reads from (the GitHub release BODY is
      # invisible to Velopack — its GithubRelease model has no body field). Failing here, before
      # anything is published, beats shipping a release whose prompt has nothing to say.
      - name: Require the release-notes file
        shell: pwsh
        run: |
          $notesFile = "docs/release-notes/${{ github.ref_name }}.md"
          if (-not (Test-Path $notesFile) -or [string]::IsNullOrWhiteSpace((Get-Content $notesFile -Raw))) {
            throw "Missing or blank $notesFile - the update prompt's What's-new section is embedded from it at pack time. Write it (see docs/release-notes/ for the shape) and re-tag."
          }

      # Delta generation is opt-in by presence: vpk pack emits a -delta.nupkg only when the
      # previous full package sits in --outputDir, and a CI runner starts empty — without this
      # step every release silently ships full-size updates only. At this point in the run the
      # latest GitHub release is still the PREVIOUS version (this tag's release is created
      # below), so "download latest" is exactly the delta base wanted. Kept after the
      # release-notes gate: a doomed run should fail before a 60 MB download, not after.
      - name: Download previous release (delta base)
        run: |
          vpk download github `
            --repoUrl https://github.com/${{ github.repository }} `
            --token ${{ secrets.GITHUB_TOKEN }} `
            --outputDir releases

      - name: Velopack pack
        run: |
          vpk pack `
            --packId CSUploader `
            --packVersion ${{ steps.version.outputs.version }} `
            --packDir publish `
            --mainExe CSUploader.exe `
            --releaseNotes docs/release-notes/${{ github.ref_name }}.md `
            --outputDir releases

      # The whole reason --releaseNotes is passed: a feed whose notesMarkdown is blank means the
      # embedding silently stopped working, and the first person to find out would be a user whose
      # prompt went quiet.
      - name: Assert the feed carries the notes
        shell: pwsh
        run: |
          # Parsed, not regexed: a regex cannot tell "  " or "\n" from real notes, and wrongly
          # rejects notes that open with a quote. (Two regex drafts each had a hole - wrong-case
          # key, then . matching the closing quote of a blank value - which is the lesson.)
          $feed = Get-Content releases/releases.win.json -Raw | ConvertFrom-Json
          foreach ($asset in $feed.Assets) {
            if ([string]::IsNullOrWhiteSpace($asset.NotesMarkdown)) {
              throw "releases.win.json asset $($asset.FileName) has blank NotesMarkdown - the --releaseNotes embedding broke."
            }
          }

      # Companion to the download step above, in the same spirit as the notes guard: if delta
      # generation quietly stopped (base package missing, vpk behavior change), every update
      # would go back to full-size downloads and a green run would never say so. If this fires
      # because past releases were legitimately deleted, that is a deliberate relaxation to
      # make here — not a silent one.
      - name: Assert a delta package was produced
        shell: pwsh
        run: |
          if (-not (Get-ChildItem releases -Filter '*-delta.nupkg')) {
            throw "No -delta.nupkg in releases/ - delta generation stopped working (did the previous full package land in releases/ before vpk pack?)."
          }

      - name: Create GitHub Release + upload Windows assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          # The delta-base download left the PREVIOUS version's full package in releases/
          # (vpk pack needs it there to diff against). Re-uploading it would attach a stale
          # package to the new release, so only nupkgs carrying THIS version's number go up;
          # everything else (Setup, Portable, feed files) is freshly written by pack.
          $version = "${{ steps.version.outputs.version }}"
          $assets = Get-ChildItem releases |
            Where-Object { $_.Name -notlike '*.nupkg' -or $_.Name -like "*-$version-*.nupkg" } |
            ForEach-Object { $_.FullName }
          # Unconditional: the required-file gate above already failed the run if the hand-written
          # notes file is absent, so the old --generate-notes fallback was unreachable dead weight.
          gh release create "${{ github.ref_name }}" $assets `
            --repo "${{ github.repository }}" `
            --title "${{ github.ref_name }}" `
            --notes-file "docs/release-notes/${{ github.ref_name }}.md"

  # The Linux job runs AFTER the Windows job (needs:) so the GitHub Release already exists —
  # this job only UPLOADS its assets to it. Tests are the Windows job's gate; here we publish
  # the portable net10.0 head (Linux-runnable), pack a Velopack AppImage, and attach it.
  release-linux:
    needs: release-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Derive version from tag
        id: version
        run: |
          tag="${{ github.ref_name }}"
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Tag must look like v1.2.3 (got $tag)" >&2
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - name: Publish self-contained linux-x64
        run: |
          dotnet publish src/CSUploader/CSUploader.csproj \
            -f net10.0 \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:Version=${{ steps.version.outputs.version }} \
            -o publish-linux

      - name: Set executable bits on native hosts
        run: |
          chmod +x publish-linux/CSUploader || true
          chmod +x publish-linux/CefGlueBrowserProcess/Xilium.CefGlue.BrowserProcess || true

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 1.2.0

      # Same delta story as the Windows job, but vpk download cannot be trusted here: the
      # Windows job has ALREADY created this tag's release, and it carries no
      # releases.linux.json yet (this job uploads it below) — so what vpk would resolve as
      # "latest" for the linux channel mid-release is undefined. Naming the previous tag and
      # fetching its linux package directly is correct regardless.
      - name: Download previous release (delta base)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prev=$(gh release list --repo "${{ github.repository }}" \
            --exclude-drafts --exclude-pre-releases --json tagName \
            --jq '[.[] | select(.tagName != "${{ github.ref_name }}")][0].tagName')
          if [ -z "$prev" ] || [ "$prev" = "null" ]; then
            echo "No previous release found to build a delta from." >&2
            exit 1
          fi
          echo "Delta base: $prev"
          mkdir -p releases-linux
          gh release download "$prev" --repo "${{ github.repository }}" \
            --pattern '*-linux-full.nupkg' --dir releases-linux

      # APPIMAGE_EXTRACT_AND_RUN lets vpk's bundled appimagetool run without libfuse2 (which
      # modern Ubuntu no longer ships). CEF itself already launches with --no-sandbox
      # (CefBootstrap.cs), which is exactly what a portable AppImage needs.
      - name: Velopack pack (Linux AppImage)
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          vpk pack \
            --packId CSUploader \
            --packVersion ${{ steps.version.outputs.version }} \
            --packDir publish-linux \
            --mainExe CSUploader \
            --packTitle CSUploader \
            --packAuthors CSUploader \
            --releaseNotes docs/release-notes/${{ github.ref_name }}.md \
            --outputDir releases-linux \
            -y

      # Same guard as the Windows job: a blank notesMarkdown means the embedding silently broke.
      - name: Assert the feed carries the notes
        run: |
          # Parsed, not regexed - see the Windows job's guard for why.
          python3 - <<'CHECK'
          import json, sys
          feed = json.load(open("releases-linux/releases.linux.json"))
          for asset in feed["Assets"]:
              if not (asset.get("NotesMarkdown") or "").strip():
                  sys.exit(f"releases.linux.json asset {asset['FileName']} has blank NotesMarkdown - the --releaseNotes embedding broke.")
          CHECK

      # Same guard as the Windows job: a green run with no delta means every Linux update
      # quietly went back to downloading the whole ~196 MB package.
      - name: Assert a delta package was produced
        run: |
          if ! ls releases-linux/*-delta.nupkg >/dev/null 2>&1; then
            echo "No -delta.nupkg in releases-linux/ - delta generation stopped working (did the previous full package land in releases-linux/ before vpk pack?)." >&2
            exit 1
          fi

      - name: Upload Linux assets to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Mirror of the Windows job's filter: the delta base downloaded above is the
          # previous version's package and must not be re-attached to the new release.
          version="${{ steps.version.outputs.version }}"
          assets=()
          for f in releases-linux/*; do
            case "$f" in
              *.nupkg) if [[ "$f" == *"-$version-"* ]]; then assets+=("$f"); fi ;;
              *) assets+=("$f") ;;
            esac
          done
          gh release upload "${{ github.ref_name }}" "${assets[@]}" \
            --repo "${{ github.repository }}" --clobber
